name: Build Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  build:
    name: Build & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create installable zip
        run: |
          # Bundle everything needed to load-unpacked into one zip
          zip -r youtube-premium-plus.zip \
            manifest.json \
            dist/ \
            src/assets/ \
            src/popup/ \
            src/background/ \
            src/options/ \
            src/inject/ \
            _locales/ \
            --exclude "*.map"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-premium-plus-${{ github.sha }}
          path: youtube-premium-plus.zip
          retention-days: 30

      - name: Upload dist folder (for load-unpacked from source)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30
