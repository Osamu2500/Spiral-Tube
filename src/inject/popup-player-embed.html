<!DOCTYPE html>
<!--
  popup-player-embed.html
  Self-hosted embed worker for the Spiral Tube Popup Player.

  Serves as a clean iframe host for YouTube's embedded player.
  Reads video/playlist params from the query string and constructs a
  privacy-enhanced YouTube embed URL (youtube-nocookie.com).

  This page is loaded as a web-accessible extension resource, removing
  the dependency on any third-party embed worker domain.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Tube Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #error {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: rgba(255,255,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      text-align: center;
    }
    #error.visible {
      display: flex;
    }
    #error svg {
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <iframe
    id="player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
  ></iframe>

  <div id="error" role="alert" aria-live="polite">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Could not load video</span>
  </div>

  <script>
    (function () {
      'use strict';

      /**
       * Allowed passthrough query params from the source YouTube URL.
       * These are forwarded into the YouTube embed URL as-is.
       */
      const PASSTHROUGH_PARAMS = ['list', 'index', 'start_radio'];

      /**
       * Builds a youtube-nocookie.com embed URL from query params
       * passed to this page by the popup player bundle.
       */
      function buildEmbedUrl() {
        const src = new URLSearchParams(location.search);
        const videoId = src.get('v');

        if (!videoId || !/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
          return null;
        }

        const embed = new URL(`https://www.youtube-nocookie.com/embed/${videoId}`);

        // Required for JS API / postMessage communication
        embed.searchParams.set('enablejsapi', '1');

        // Forward playlist / radio params if present
        for (const key of PASSTHROUGH_PARAMS) {
          const val = src.get(key);
          if (val) embed.searchParams.set(key, val);
        }

        return embed.href;
      }

      const player = document.getElementById('player');
      const errorEl = document.getElementById('error');

      const embedUrl = buildEmbedUrl();

      if (embedUrl) {
        player.src = embedUrl;
        player.onerror = function () {
          player.style.display = 'none';
          errorEl.classList.add('visible');
        };
      } else {
        player.style.display = 'none';
        errorEl.classList.add('visible');
      }

      /**
       * Forward postMessage events from the YouTube player iframe
       * up to the parent popup player frame so its JS API calls
       * (play, pause, seek, etc.) work correctly.
       */
      window.addEventListener('message', function (event) {
        if (event.source === player.contentWindow) {
          try {
            window.parent.postMessage(event.data, '*');
          } catch (_) {}
        } else if (event.source === window.parent) {
          try {
            player.contentWindow.postMessage(event.data, '*');
          } catch (_) {}
        }
      });
    })();
  </script>
</body>
</html>
